<style>
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
/* Страница сама не прокручивается: прокручиваются только списки внутри экранов (.scroll).
   Иначе на iPhone вся страница «ездит» на высоту панели Safari и перехватывает скролл. */
html, body {
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}
body {
  background: #050402;
  font-family: 'Plus Jakarta Sans', sans-serif;
  -webkit-text-size-adjust: 100%;
}
/* Высота = видимая область (без клавиатуры), см. fitViewport() ниже */
#phone-wrap {
  position: fixed;
  left: 0; right: 0; top: 0;
  height: var(--app-h, 100dvh);
  transform: translateY(var(--app-top, 0px));
  background: #040302;
}
.scroll {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  touch-action: pan-y;
  min-height: 0;
}
/* Турнир: на высоких экранах таймер закреплён, прокручивается только список игроков.
   На невысоких (почти все iPhone с панелями Safari) прокручивается всё под заголовком,
   иначе под список остаётся 2–3 строки. */
.tourn-body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
@media (max-height: 760px) {
  .tourn-body { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; }
  .tourn-body > .scroll.tourn-list { flex: none; overflow: visible; }
}

/* Animations */
@keyframes shimmer {

  100% { background-position: 200% center; }
}
@keyframes slideUp {

}
@keyframes fadeScale {
  from { opacity: 0; transform: scale(0.97); }

/* Hide number input spinners */
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
input[type=number] { -moz-appearance:textfield; }

// ── UTILS ───────────────────────────────────────────────
function simplifyDebts(bal) {
  const cred=[], debt=[];
  for (const [n,b] of Object.entries(bal)) {
    if (b >  0.5) cred.push({n,a:b});
    if (b < -0.5) debt.push({n,a:-b});
  }
  cred.sort((a,b)=>b.a-a.a); debt.sort((a,b)=>b.a-a.a);
  const out=[]; let i=0,j=0;
  while(i<cred.length && j<debt.length){
    const amt=Math.min(cred[i].a,debt[j].a);
    out.push({from:debt[j].n,to:cred[i].n,amount:Math.round(amt)});
    cred[i].a-=amt; debt[j].a-=amt;
    if(cred[i].a<0.5)i++; if(debt[j].a<0.5)j++;
  }
  return out;
}
function beep() {
  try {
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.frequency.value=880;
    g.gain.setValueAtTime(0.3,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.6);
    o.start(ctx.currentTime);o.stop(ctx.currentTime+0.6);
  }catch(e){}
}

// ── PERSISTENCE ─────────────────────────────────────────
// Всё состояние игры пишется в localStorage, поэтому сворачивание браузера,
// блокировка экрана и перезагрузка вкладки не теряют данные.
// Ключи: a_* — экран и игра целиком, g_* — состояние текущей игры (чистится при новой игре),
// d_* — черновик настройки (список игроков, закуп, курс).
const LS='pk2_';
function lsGet(k,def){ try{ const v=localStorage.getItem(LS+k); return v==null?def:JSON.parse(v); }catch(e){ return def; } }
function lsSet(k,v){ try{ localStorage.setItem(LS+k,JSON.stringify(v)); }catch(e){} }
function lsClearGame(){ try{ Object.keys(localStorage).filter(k=>k.startsWith(LS+'g_')).forEach(k=>localStorage.removeItem(k)); }catch(e){} }
function usePersist(key,def){
  const [v,setV]=React.useState(()=>lsGet(key,typeof def==='function'?def():def));
  React.useEffect(()=>{ lsSet(key,v); },[key,v]);
  return [v,setV];
}

// ── SHARED COMPONENTS ───────────────────────────────────
const GoldDivider = () => (
  <div style={{display:'flex',alignItems:'center',gap:8,margin:'4px 0'}}>
    <div style={{flex:1,height:1,background:`linear-gradient(90deg,transparent,${C.gold})`}}/>
    <span style={{color:C.gold,fontSize:9}}>♦</span>

  </div>
);

function Btn({label,onClick,ghost,danger,small,disabled,full,style={}}) {
  const base = {
    borderRadius:12, padding:small?'8px 14px':'13px 20px',
    fontSize:small?13:15, fontWeight:700, border:'none', cursor:disabled?'not-allowed':'pointer',
    opacity:disabled?0.4:1, transition:'filter 0.12s, transform 0.1s',
    fontFamily:'Plus Jakarta Sans', width:full?'100%':undefined, ...style,
  };
  if(danger) return <button style={{...base,background:'transparent',border:'1px solid rgba(194,59,34,0.5)',color:C.red}} onClick={onClick} disabled={disabled}>{label}</button>;
  if(ghost)  return <button style={{...base,background:'transparent',border:`1px solid ${C.borderBright}`,color:C.gold}} onClick={onClick} disabled={disabled}>{label}</button>;
  return <button style={{...base,background:`linear-gradient(135deg,#c9a84c,#e8c86a 40%,#c9a84c 60%,#a07820)`,color:'#0a0906'}} onClick={onClick} disabled={disabled}>{label}</button>;
}

function Header({title,sub,onBack}) {

      <div style={{fontFamily:'Cinzel',fontSize:20,fontWeight:700}} className="gold-text">{title}</div>

function BottomSheet({title,sub,onClose,children}) {
  return (
    <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.82)',backdropFilter:'blur(4px)',display:'flex',alignItems:'flex-end',zIndex:100}} onClick={onClose}>

function Input({value,onChange,placeholder,type='text',style={},...rest}) {
  return <input {...rest} type={type} value={value} onChange={onChange} placeholder={placeholder} inputMode={type==='number'?'numeric':undefined}
    style={{background:'rgba(255,255,255,0.04)',border:`1px solid ${C.borderBright}`,borderRadius:10,color:C.cream,fontFamily:'Plus Jakarta Sans',fontSize:15,padding:'11px 14px',width:'100%',outline:'none',...style}} />;
}

const newPlayer = (name,amount) => ({name,buyins:[amount],chips:null,cashedOut:false,rebuys:0,addon:0,eliminated:false,prize:0});

// ── РАННИЙ УХОД: расчёт сразу ───────────────────────────
// p.paidNow = {with, amount}: игрок ушёл раньше и уже рассчитался с игроком `with`.
// amount > 0 — получил от него деньги, amount < 0 — отдал ему.
// В общем финале этот перевод вычитается из балансов обоих: если потом поправили
// фишки или закупы, разница просто уйдёт в общий расчёт.
function applyPaidNow(bal, players) {
  const done = [];
  players.forEach(p=>{
    const s = p.paidNow;
    if(!s || !s.amount || !players.some(q=>q.name===s.with)) return;
    bal[p.name] = (bal[p.name]||0) - s.amount;
    bal[s.with] = (bal[s.with]||0) + s.amount;
    done.push(s.amount>0 ? {from:s.with,to:p.name,amount:s.amount} : {from:p.name,to:s.with,amount:-s.amount});
  });
  return done;
}
const paidNowText = (name,s) => s.amount>0 ? `${s.with} → ${name} ${s.amount}₽` : `${name} → ${s.with} ${-s.amount}₽`;

// Выбор: с кем ушедший рассчитывается прямо сейчас
function PayNowPicker({leaver,amount,candidates,value,onChange}) {
  if(!amount) return <div style={{color:C.muted,fontSize:12,marginBottom:14}}>В ноль — никому ничего не должен.</div>;
  if(candidates.length===0) return null;
  const q = amount>0 ? `${leaver} получает ${amount}₽. От кого?` : `${leaver} отдаёт ${-amount}₽. Кому?`;
  const opts = [{v:'',label:'Потом, в общем расчёте'},...candidates.map(n=>({v:n,label:n}))];
  return (
    <div style={{marginBottom:14}}>
      <div style={{color:C.gold,fontSize:11,textTransform:'uppercase',letterSpacing:1,fontWeight:600,marginBottom:4}}>Рассчитаться сразу</div>
      <div style={{color:C.muted,fontSize:12,marginBottom:8}}>{q}</div>
      <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
        {opts.map(o=>{
          const on = value===o.v;
          return <button key={o.v||'_later'} onClick={()=>onChange(o.v)} style={{padding:'8px 12px',borderRadius:9,fontSize:13,fontWeight:600,cursor:'pointer',border:`1.5px solid ${on?C.green:'rgba(255,255,255,0.08)'}`,background:on?'rgba(45,138,74,0.15)':'rgba(255,255,255,0.03)',color:on?C.green:C.muted}}>{o.label}</button>;
        })}
      </div>
      {value && <div style={{color:C.green,fontSize:13,marginTop:8}}>✓ {paidNowText(leaver,{with:value,amount})} — сейчас, в финале это учтётся</div>}
    </div>
  );
}

// Уже сделанный расчёт сразу — показать и при необходимости отменить

  return (
    <div style={{display:'flex',alignItems:'center',gap:8,background:'rgba(45,138,74,0.08)',border:'1px solid rgba(45,138,74,0.3)',borderRadius:10,padding:'9px 12px',marginBottom:14}}>
      <div style={{flex:1}}>
        <div style={{color:C.green,fontSize:13,fontWeight:600}}>Рассчитался сразу: {paidNowText(name,paidNow)}</div>

      </div>

    </div>
  );
}
const RemoveLink = ({onClick}) => (
  <button onClick={onClick} style={{width:'100%',marginTop:12,background:'transparent',border:'none',color:C.red,fontSize:13,cursor:'pointer',padding:6,opacity:0.85}}>Удалить игрока из игры</button>

const Stepper = ({value,onChange,min=0}) => (
  <div style={{display:'flex',alignItems:'center',gap:10}}>
    <Btn label="−" ghost small onClick={()=>onChange(Math.max(min,value-1))} disabled={value<=min} style={{width:40,padding:'8px 0',fontSize:18}}/>
    <div style={{fontFamily:'Cinzel',color:C.cream,fontSize:18,fontWeight:700,minWidth:24,textAlign:'center'}}>{value}</div>
    <Btn label="+" ghost small onClick={()=>onChange(value+1)} style={{width:40,padding:'8px 0',fontSize:18}}/>
  </div>
);

// Добавить игрока в уже идущую игру
function AddPlayerSheet({players,defaultBuyin,onAdd,onClose}) {
  const [name,setName] = React.useState('');
  const [amt,setAmt]   = React.useState(String(defaultBuyin));
  const n = name.trim();
  const dup = !!n && players.some(p=>p.name.toLowerCase()===n.toLowerCase());
  const amount = parseInt(amt)||0;
  const ok = !!n && !dup && amount>0;
  const submit = () => { if(ok) onAdd(newPlayer(n,amount)); };
  return (
    <BottomSheet title="Добавить игрока" sub="Игра продолжается, новый игрок сразу за столом" onClose={onClose}>
      <Input autoFocus value={name} onChange={e=>setName(e.target.value)} placeholder="Имя игрока" onKeyDown={e=>{if(e.key==='Enter')submit();}}/>
      {dup && <div style={{color:C.red,fontSize:12,marginTop:6}}>Игрок с таким именем уже есть</div>}
      <div style={{color:C.muted,fontSize:12,margin:'12px 0 6px'}}>Стартовый закуп</div>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}>
        <Input type="number" value={amt} onChange={e=>setAmt(e.target.value)} placeholder={String(defaultBuyin)} style={{flex:1}}/>
        <span style={{color:C.muted,fontSize:14}}>₽</span>
      </div>
      <div style={{display:'flex',gap:8}}>
        <Btn label="Отмена" ghost full onClick={onClose}/>
        <Btn label="Добавить" full onClick={submit} disabled={!ok}/>
      </div>
    </BottomSheet>
  );
}

// Кэш: правка / отмена закупов игрока, правка кэш-аута
function CashEditSheet({player,defaultBuyin,ratio,onSave,onReturn,onRemove,onClose}) {
  const [rows,setRows]   = React.useState(player.buyins.map(String));
  const [chips,setChips] = React.useState(player.cashedOut?String(player.chips??0):'');
  const [paidNow,setPaidNow] = React.useState(player.paidNow||null);
  const amounts = rows.map(v=>parseInt(v)||0).filter(v=>v>0);
  const total = amounts.reduce((s,v)=>s+v,0);
  const rub = Math.round((parseInt(chips)||0)/ratio);
  const save = () => onSave(player.cashedOut?{buyins:amounts,chips:parseInt(chips)||0,paidNow}:{buyins:amounts,paidNow});
  return (
    <BottomSheet title="Закупы" sub={player.name} onClose={onClose}>
      <PaidNowInfo name={player.name} paidNow={paidNow} onCancel={()=>setPaidNow(null)}/>
      <div className="scroll" style={{maxHeight:'34vh',marginBottom:8}}>
        {rows.length===0 && <div style={{color:C.muted,fontSize:13,marginBottom:8}}>Закупов нет</div>}
        {rows.map((v,i)=>(
          <div key={i} style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
            <span style={{color:C.muted,fontSize:12,width:20,flexShrink:0}}>{i+1}.</span>
            <Input type="number" value={v} onChange={e=>setRows(r=>r.map((x,j)=>j===i?e.target.value:x))} style={{flex:1,padding:'9px 12px'}}/>
            <span style={{color:C.muted,fontSize:14}}>₽</span>
            <button onClick={()=>setRows(r=>r.filter((_,j)=>j!==i))} title="Отменить закуп" style={{background:'transparent',border:'1px solid rgba(194,59,34,0.4)',borderRadius:8,cursor:'pointer',color:C.red,fontSize:16,width:36,height:36,flexShrink:0}}>×</button>
          </div>
        ))}
      </div>

      {player.cashedOut && (
        <div style={{borderTop:`1px solid ${C.border}`,paddingTop:12,marginBottom:14}}>
          <div style={{color:C.muted,fontSize:12,marginBottom:6}}>Фишки на выходе</div>
          <Input type="number" value={chips} onChange={e=>setChips(e.target.value)} placeholder="0"/>
          <div style={{color:C.dimmer,fontSize:12,marginTop:6}}>= {rub}₽ → {rub-total>=0?'+':''}{rub-total}₽</div>
          <Btn label="↩ Вернуть за стол" ghost small onClick={onReturn} style={{marginTop:10}}/>
        </div>
      )}
      <div style={{display:'flex',justifyContent:'space-between',color:C.muted,fontSize:13,marginBottom:10}}><span>Итого</span><span style={{fontFamily:'Cinzel',color:C.gold,fontWeight:700,fontSize:15}}>{total}₽</span></div>
      <div style={{display:'flex',gap:8}}>
        <Btn label="Отмена" ghost full onClick={onClose}/>
        <Btn label="Сохранить" full onClick={save}/>
      </div>
      <RemoveLink onClick={onRemove}/>
    </BottomSheet>
  );
}

function FloatingSuits() {
  const suits=[{s:'♠',x:8,y:14,r:'-15deg',o:0.06,d:0},{s:'♥',x:80,y:10,r:'20deg',o:0.07,d:1.2,red:true},{s:'♦',x:86,y:72,r:'-8deg',o:0.06,d:0.8,red:true},{s:'♣',x:6,y:76,r:'22deg',o:0.05,d:1.8}];
  return (
    <div style={{position:'absolute',inset:0,pointerEvents:'none',overflow:'hidden'}}>
      {suits.map((s,i)=>(
        <div key={i} style={{position:'absolute',left:`${s.x}%`,top:`${s.y}%`,fontSize:38,color:s.red?C.red:C.cream,opacity:s.o,'--r':s.r,animation:`suitFloat ${3+i*0.6}s ease-in-out ${s.d}s infinite`}}>{s.s}</div>

}

}

// SCREEN: SETUP
// ════════════════════════════════════════════════════════
function SetupScreen({mode,onStart,onBack}) {
  const [players,setPlayers] = usePersist('d_players',[]);
  const [input,setInput]     = React.useState('');
  const [buyin,setBuyin]     = usePersist('d_buyin','300');
  const [ratio,setRatio]     = usePersist('d_ratio',2);
  const [editing,setEditing] = React.useState(null);
  const [editVal,setEditVal] = React.useState('');
  const isCash = mode==='cash';
  const canStart = players.length>=2;
  // Свой стартовый закуп у игрока (только кэш): пусто = общий
  const common = parseInt(buyin)||300;
  const startOf = p => (isCash && parseInt(p.buyin)>0) ? parseInt(p.buyin) : common;
  const bankTotal = players.reduce((s,p)=>s+startOf(p),0);
  const setOwn = (i,v) => setPlayers(ps=>ps.map((q,j)=>j===i?{...q,buyin:v}:q));

  const addPlayer = () => {
    const name=input.trim();
    if(!name||players.find(p=>p.name===name)) return;
    setPlayers(ps=>[...ps,{name}]);
    setInput('');
  };

  return (
    <div className="screen-anim" style={{flex:1,height:0,background:C.bg,display:'flex',flexDirection:'column',overflow:'hidden'}}>
      <Header title={isCash?'Кэш-игра':'Турнир'} sub="Добавьте игроков" onBack={onBack}/>

      <div className="scroll" style={{flex:1,padding:'0 16px 12px'}}>
        {/* Buyin (cash only) */}
        {isCash && (
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:13,padding:'14px',marginBottom:12}}>
            <div style={{color:C.gold,fontSize:11,textTransform:'uppercase',letterSpacing:1,marginBottom:10,fontWeight:600}}>💰 Стартовый закуп</div>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
              <Input type="number" value={buyin} onChange={e=>setBuyin(e.target.value)} placeholder="300" style={{flex:1}}/>
              <span style={{color:C.muted,fontSize:14,flexShrink:0}}>₽</span>
            </div>
            <div style={{color:C.muted,fontSize:12,marginBottom:8}}>Курс фишек к рублям</div>
            <div style={{display:'flex',gap:6}}>
              {[1,2,5,10].map(v=>(
                <button key={v} onClick={()=>setRatio(v)} style={{flex:1,padding:'8px 4px',borderRadius:9,fontSize:14,fontWeight:600,cursor:'pointer',border:`1.5px solid ${ratio===v?C.green:'rgba(255,255,255,0.08)'}`,background:ratio===v?'rgba(45,138,74,0.15)':'rgba(255,255,255,0.03)',color:ratio===v?C.green:C.muted,transition:'all 0.15s'}}>{v}:1</button>
              ))}
            </div>
            <div style={{color:C.dimmer,fontSize:11,marginTop:7}}>
              {ratio===1?'1 фишка = 1 ₽':`${ratio} фишки = 1 ₽`}
            </div>
            <div style={{color:C.dimmer,fontSize:11,marginTop:10,borderTop:`1px solid ${C.border}`,paddingTop:8}}>
              Если у кого-то закуп другой — впишите сумму напротив его имени
            </div>
          </div>
        )}

        {/* Add player */}
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:13,padding:'14px',marginBottom:12}}>
          <div style={{color:C.gold,fontSize:11,textTransform:'uppercase',letterSpacing:1,marginBottom:10,fontWeight:600}}>♠ Добавить игрока</div>
          <div style={{display:'flex',gap:8}}>
            <Input value={input} onChange={e=>setInput(e.target.value)} placeholder="Имя игрока" style={{flex:1}}
              onKeyDown={e=>e.key==='Enter'&&addPlayer()}/>
            <Btn label="+" onClick={addPlayer} small style={{minWidth:42,borderRadius:9}}/>
          </div>
        </div>

        {/* Player list */}
        {players.length>0 && (
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:13,overflow:'hidden'}}>
            {players.map((p,i)=>(
              <div key={p.name} style={{display:'flex',alignItems:'center',padding:'11px 14px',borderBottom:i<players.length-1?`1px solid ${C.border}`:'none',animation:'slideUp 0.2s ease'}}>
                <div style={{width:28,height:28,borderRadius:7,background:C.surface2,border:`1px solid ${C.border}`,display:'flex',alignItems:'center',justifyContent:'center',color:C.gold,fontSize:12,fontWeight:700,marginRight:10,flexShrink:0}}>{i+1}</div>
                {editing===i
                  ?<input autoFocus value={editVal} onChange={e=>setEditVal(e.target.value)}
                    onBlur={()=>{const n=editVal.trim();if(n&&!players.find((q,j)=>j!==i&&q.name===n))setPlayers(ps=>ps.map((q,j)=>j===i?{...q,name:n}:q));setEditing(null);}}
                    onKeyDown={e=>{if(e.key==='Enter')e.target.blur();}}
                    style={{background:'transparent',border:'none',borderBottom:`1px solid ${C.gold}`,color:C.cream,fontSize:14,flex:1,outline:'none',padding:'2px 4px'}}/>
                  :<span onClick={()=>{setEditing(i);setEditVal(p.name);}} style={{color:C.cream,flex:1,fontSize:14,cursor:'pointer'}}>{p.name} <span style={{color:C.dimmer,fontSize:10}}>✎</span></span>
                }
                {isCash && (()=>{
                  const own = parseInt(p.buyin)>0 && parseInt(p.buyin)!==common;
                  return (
                    <div style={{display:'flex',alignItems:'center',gap:4,marginLeft:8,flexShrink:0}}>
                      <input type="number" inputMode="numeric" value={p.buyin??''} placeholder={String(common)}
                        onChange={e=>setOwn(i,e.target.value)} aria-label={`Стартовый закуп ${p.name}`}
                        style={{width:76,background:own?'rgba(201,168,76,0.12)':'rgba(255,255,255,0.03)',border:`1px solid ${own?C.gold:C.border}`,borderRadius:8,color:own?C.goldLight:C.cream,fontSize:14,fontWeight:own?700:400,padding:'6px 8px',textAlign:'right',outline:'none',fontFamily:'Plus Jakarta Sans'}}/>
                      <span style={{color:C.muted,fontSize:12}}>₽</span>
                    </div>
                  );
                })()}
                <button onClick={()=>setPlayers(ps=>ps.filter((_,j)=>j!==i))} style={{background:'transparent',border:'none',cursor:'pointer',color:C.red,fontSize:18,padding:4}}>×</button>
              </div>
            ))}
          </div>
        )}
        {players.length<2 && <div style={{textAlign:'center',color:C.dimmer,fontSize:12,marginTop:12}}>Минимум 2 игрока</div>}
      </div>

      {/* Bottom bar */}
      <div style={{padding:'10px 16px 14px',background:C.bg,borderTop:`1px solid ${C.border}`,flexShrink:0,display:'flex',alignItems:'center',gap:10}}>
        <div style={{textAlign:'center',minWidth:52}}>
          <div style={{color:C.muted,fontSize:10}}>Игроков</div>
          <div style={{color:C.cream,fontSize:16,fontWeight:700,fontFamily:'Cinzel'}}>{players.length}</div>
        </div>
        {isCash && <div style={{textAlign:'center',minWidth:64}}>
          <div style={{color:C.muted,fontSize:10}}>Банк</div>
          <div style={{color:C.gold,fontSize:16,fontWeight:700,fontFamily:'Cinzel'}}>{players.length?`${bankTotal}₽`:'—'}</div>
        </div>}
        <Btn label="Начать →" full onClick={()=>{
          const b=isCash?common:300;
          onStart({players:players.map(p=>newPlayer(p.name,isCash?startOf(p):300)),buyin:b,ratio});
          lsSet('d_players', players.map(({buyin:_,...q})=>q)); // свои суммы — только на эту игру
        }} disabled={!canStart} style={{flex:1,borderRadius:11,fontSize:15,padding:'13px'}}/>
      </div>
    </div>
  );
}

// SCREEN: CASH GAME
// ════════════════════════════════════════════════════════
function CashScreen({setup,players,setPlayers,onEnd,onBack}) {
  const [sheet,setSheet]     = React.useState(null);
  const [chipInput,setChipInput] = React.useState('');
  const [buyinAmt,setBuyinAmt]   = React.useState(String(setup.buyin));
  const [lastBuyin,setLastBuyin] = usePersist('g_lastBuyin',null);
  const [payWith,setPayWith]     = React.useState('');

  const paid = p => p.buyins.reduce((s,b)=>s+b,0);
  const bank = players.reduce((s,p)=>s+paid(p),0);
  const active = players.filter(p=>!p.cashedOut).length;
  const buyinCount = players.reduce((s,p)=>s+p.buyins.length,0);

  const updatePlayer = (name,fn) => setPlayers(ps=>ps.map(p=>p.name===name?fn(p):p));

  const confirmBuyin = () => {
    const amt=parseInt(buyinAmt)||0; if(!amt) return;
    updatePlayer(sheet.player.name,p=>({...p,buyins:[...p.buyins,amt]}));
    setLastBuyin({name:sheet.player.name,amt});
    setSheet(null);
  };
  const undoBuyin = () => {
    if(!lastBuyin) return;
    updatePlayer(lastBuyin.name,p=>{
      const i=p.buyins.lastIndexOf(lastBuyin.amt);
      return i<0?p:{...p,buyins:p.buyins.filter((_,j)=>j!==i)};
    });
    setLastBuyin(null);
  };
  const confirmCashout = () => {
    const chips=parseInt(chipInput); if(isNaN(chips)||chips<0) return;
    const net=rub(chips)-paid(sheet.player);
    const paidNow = payWith&&net ? {with:payWith,amount:net} : null;
    updatePlayer(sheet.player.name,p=>({...p,chips,cashedOut:true,paidNow}));
    setSheet(null);
  };
  const editPlayer = sheet?.type==='edit' ? players.find(p=>p.name===sheet.name) : null;
  const saveEdit = patch => { updatePlayer(editPlayer.name,p=>({...p,...patch})); setLastBuyin(null); setSheet(null); };
  const removePlayer = () => {
    const p=editPlayer;
    const dep=players.find(q=>q.paidNow?.with===p.name);
    if(dep){ alert(`С ${p.name} уже рассчитался ${dep.name}. Сначала отмените этот расчёт в карточке ${dep.name}.`); return; }
    if(!confirm(`Удалить ${p.name} из игры? Его закупы (${paid(p)}₽) уйдут из банка.`)) return;
    setPlayers(ps=>ps.filter(q=>q.name!==p.name));
    setLastBuyin(null); setSheet(null);
  };

  const rub = chips => Math.round(chips/setup.ratio);
  const hintChips = parseInt(chipInput)||0;
  const hintRub = rub(hintChips);
  const hintNet = sheet?.player ? hintRub - paid(sheet.player) : 0;

  return (
    <div className="screen-anim" style={{flex:1,height:0,background:C.bg,display:'flex',flexDirection:'column',overflow:'hidden',position:'relative'}}>
      {/* Header */}
      <div style={{background:`linear-gradient(180deg,#1a1200,${C.bg})`,flexShrink:0}}>
        <Header title="Кэш-игра" onBack={onBack}/>
        <StatBar items={[{label:'В банке',value:`${bank}₽`,accent:true},{label:'За столом',value:active},{label:'Закупов',value:buyinCount}]}/>
      </div>
      <div style={{height:2,background:`linear-gradient(90deg,transparent,${C.green},transparent)`,flexShrink:0}}/>

      <div className="scroll" style={{flex:1,padding:'12px 16px'}}>
        {players.map(p=>{
          const p2=paid(p);
          const net=p.cashedOut?rub(p.chips||0)-p2:null;
          return (
            <PlayerRow key={p.name} name={p.name} dim={p.cashedOut} onClick={()=>setSheet({type:'edit',name:p.name})}
              sub={`${p2}₽ · ${p.buyins.length} закуп${p.buyins.length===1?'':p.buyins.length>=2&&p.buyins.length<=4?'а':'ов'}${p.paidNow?' · рассчитался ✓':''}`}
              badge={p.cashedOut?{text:net>=0?`+${net}₽`:`${net}₽`,color:net>0?C.green:net<0?C.red:C.muted,bg:net>0?'rgba(45,138,74,0.15)':net<0?'rgba(194,59,34,0.15)':'rgba(90,78,56,0.1)',border:net>0?'rgba(45,138,74,0.3)':net<0?'rgba(194,59,34,0.3)':'transparent'}:null}
              actions={!p.cashedOut&&<>
                <Btn label="Закуп" ghost small onClick={()=>{setBuyinAmt(String(p.buyins[0]||setup.buyin));setSheet({type:'buyin',player:p});}}/>
                <Btn label="Выйти" danger small onClick={()=>{setChipInput('');setPayWith('');setSheet({type:'cashout',player:p});}}/>
              </>}
            />
          );
        })}
      </div>

      <div style={{padding:'10px 16px 14px',background:C.bg,borderTop:`1px solid ${C.border}`,flexShrink:0}}>
        {lastBuyin && players.some(p=>p.name===lastBuyin.name) && (
          <button onClick={undoBuyin} style={{width:'100%',marginBottom:8,background:'rgba(201,168,76,0.08)',border:`1px solid ${C.borderBright}`,borderRadius:10,color:C.gold,fontSize:13,fontWeight:600,padding:'8px',cursor:'pointer'}}>
            ↩ Отменить закуп {lastBuyin.name} {lastBuyin.amt}₽
          </button>
        )}
        <div style={{display:'flex',gap:8}}>
          <Btn label="+ Игрок" ghost onClick={()=>setSheet({type:'addplayer'})} style={{borderRadius:11,padding:'11px 14px',flexShrink:0}}/>
          <Btn label="Финал → Расчёт" full onClick={()=>onEnd(players)} style={{flex:1,borderRadius:11}}/>
        </div>
      </div>

      {sheet?.type==='buyin' && (
        <BottomSheet title="Закуп" sub={sheet.player.name} onClose={()=>setSheet(null)}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}>
            <Input type="number" value={buyinAmt} onChange={e=>setBuyinAmt(e.target.value)} placeholder="300" style={{flex:1}}/>
            <span style={{color:C.muted,fontSize:14}}>₽</span>
          </div>
          <div style={{display:'flex',gap:8}}>
            <Btn label="Отмена" ghost full onClick={()=>setSheet(null)}/>
            <Btn label={`+${buyinAmt}₽`} full onClick={confirmBuyin}/>
          </div>
        </BottomSheet>
      )}
      {sheet?.type==='cashout' && (
        <BottomSheet title="Выход" sub={`${sheet.player.name} уходит · фишки на руках`} onClose={()=>setSheet(null)}>
          <Input type="number" value={chipInput} onChange={e=>setChipInput(e.target.value)} placeholder="Кол-во фишек"/>
          {chipInput && (
            <div style={{color:hintNet>=0?C.green:C.red,fontSize:13,margin:'8px 0 14px'}}>
              {hintChips} фишек = {hintRub}₽ → {hintNet>=0?'+':''}{hintNet}₽
            </div>
          )}
          {chipInput && <PayNowPicker leaver={sheet.player.name} amount={hintNet} value={payWith} onChange={setPayWith}
            candidates={players.filter(q=>!q.cashedOut&&q.name!==sheet.player.name).map(q=>q.name)}/>}
          <div style={{display:'flex',gap:8}}>
            <Btn label="Отмена" ghost full onClick={()=>setSheet(null)}/>
            <Btn label="Подтвердить" full onClick={confirmCashout}/>
          </div>
        </BottomSheet>
      )}
      {sheet?.type==='addplayer' && (
        <AddPlayerSheet players={players} defaultBuyin={setup.buyin} onClose={()=>setSheet(null)}
          onAdd={p=>{setPlayers(ps=>[...ps,p]);setSheet(null);}}/>
      )}
      {editPlayer && (
        <CashEditSheet key={editPlayer.name} player={editPlayer} defaultBuyin={editPlayer.buyins[0]||setup.buyin} ratio={setup.ratio}
          onClose={()=>setSheet(null)} onSave={saveEdit} onRemove={removePlayer}
          onReturn={()=>saveEdit({cashedOut:false,chips:null})}/>
      )}
    </div>
  );
}

// ════════════════════════════════════════════════════════
// SCREEN: TOURNAMENT
// ════════════════════════════════════════════════════════
function TournamentScreen({setup,players,setPlayers,onAddon,onEnd,onBack}) {
  // Таймер хранит момент окончания уровня (endsAt), а не счётчик секунд:
  // так время идёт правильно при блокировке экрана, свёрнутом браузере и перезагрузке.
  const [tm,setTm]   = usePersist('g_timer',{lvl:0,left:LEVEL_SECS,endsAt:null});
  const [now,setNow] = React.useState(Date.now());
  const [sheet,setSheet]     = React.useState(null);
  const [showLevels,setShowLevels] = React.useState(false);
  const [lastElim,setLastElim]     = usePersist('g_lastElim',null);
  const addonDone = setup.addonDone||false;
  const running = tm.endsAt!=null;
  const lvl = tm.lvl;
  const secs = running ? Math.min(LEVEL_SECS,Math.max(0,Math.ceil((tm.endsAt-now)/1000))) : tm.left;

  React.useEffect(()=>{
    if(!running) return;
    const tick=()=>setNow(Date.now());
    tick();
    const id=setInterval(tick,500);
    document.addEventListener('visibilitychange',tick);
    return ()=>{ clearInterval(id); document.removeEventListener('visibilitychange',tick); };
  },[running]);

  // Переход уровней (в том числе нескольких сразу, если экран был выключен долго)
  React.useEffect(()=>{
    if(!running||now<tm.endsAt) return;
    let l=tm.lvl, endsAt=tm.endsAt, addonStop=false;
    while(now>=endsAt){
      l=Math.min(l+1,BLINDS.length-1);
      if(l===ADDON_AFTER&&!addonDone){ addonStop=true; break; }
      endsAt+=LEVEL_SECS*1000;
    }
    beep();
    if(navigator.vibrate) navigator.vibrate([300,100,300]);
    setTm(addonStop?{lvl:l,left:LEVEL_SECS,endsAt:null}:{lvl:l,left:LEVEL_SECS,endsAt});
    if(addonStop) setTimeout(()=>alert('🎰 Время аддона!'),100);
  },[now,running,tm.endsAt]);

  const toggleRun = () => {
    const n=Date.now(); setNow(n);
    setTm(t=>t.endsAt!=null?{...t,left:Math.max(1,Math.ceil((t.endsAt-n)/1000)),endsAt:null}:{...t,endsAt:n+t.left*1000});
  };
  const jumpLevel = d => {
    const n=Date.now(); setNow(n);
    setTm(t=>({lvl:Math.max(0,Math.min(t.lvl+d,BLINDS.length-1)),left:LEVEL_SECS,endsAt:t.endsAt!=null?n+LEVEL_SECS*1000:null}));
  };

  const blind=BLINDS[Math.min(lvl,BLINDS.length-1)];
  const nextBlind=BLINDS[Math.min(lvl+1,BLINDS.length-1)];
  const mm=String(Math.floor(secs/60)).padStart(2,'0');
  const ss2=String(secs%60).padStart(2,'0');
  const pct=(secs/LEVEL_SECS)*100;
  const timeColor=secs<=30?C.red:secs<=90?'#ffa657':C.green;
  const isPreAddon=lvl<ADDON_AFTER;
  const active=players.filter(p=>!p.eliminated).length;
  const tPaid = p => (p.buyins[0]||0)+p.rebuys*300+p.addon;
  const bank=players.reduce((s,p)=>s+tPaid(p),0);

  const [payWith,setPayWith] = React.useState('');
  const eliminate = name => {
    const p=players.find(q=>q.name===name);
    const paidNow = payWith ? {with:payWith,amount:-tPaid(p)} : (p.paidNow||null);
    setLastElim(name);
    setPlayers(ps=>ps.map(q=>q.name===name?{...q,eliminated:true,paidNow,paidNowPrev:q.paidNow??null}:q));
    setSheet(null);
  };
  const rebuy = name => { setPlayers(ps=>ps.map(p=>p.name===name?{...p,rebuys:p.rebuys+1,eliminated:false}:p)); setLastElim(null); setSheet(null); };
  const undoElim = () => {
    if(!lastElim) return;
    // отмена вылета по ошибке — отменяем и расчёт, сделанный в этом окне
    setPlayers(ps=>ps.map(p=>p.name===lastElim?{...p,eliminated:false,paidNow:p.paidNowPrev??null}:p));
    setLastElim(null);
  };
  const editPlayer = sheet?.type==='edit' ? players.find(p=>p.name===sheet.name) : null;
  const saveEdit = patch => { setPlayers(ps=>ps.map(p=>p.name===editPlayer.name?{...p,...patch}:p)); setSheet(null); };
  const removePlayer = () => {
    const p=editPlayer;
    const dep=players.find(q=>q.paidNow?.with===p.name);
    if(dep){ alert(`С ${p.name} уже рассчитался ${dep.name}. Сначала отмените этот расчёт в карточке ${dep.name}.`); return; }
    if(!confirm(`Удалить ${p.name} из турнира? Его взносы (${tPaid(p)}₽) уйдут из банка.`)) return;
    setPlayers(ps=>ps.filter(q=>q.name!==p.name));
    if(lastElim===p.name) setLastElim(null);
    setSheet(null);
  };

  return (
    <div className="screen-anim" style={{flex:1,height:0,background:C.bg,display:'flex',flexDirection:'column',overflow:'hidden',position:'relative'}}>
      <div style={{background:'#050d05',flexShrink:0}}>
        <Header title="Турнир" onBack={onBack}/>
      </div>
      {/* На невысоких экранах таймер прокручивается вместе со списком (см. .tourn-body в CSS) */}
      <div className="tourn-body">
      <div style={{background:`linear-gradient(180deg,#050d05,${C.bg})`,flexShrink:0}}>

        {/* Timer */}
        <div style={{margin:'0 16px 10px',background:`radial-gradient(ellipse at center,#121d12,#090e09)`,border:`1px solid rgba(45,138,74,0.35)`,borderRadius:16,padding:'16px',textAlign:'center'}}>
          <div style={{color:C.muted,fontSize:11,textTransform:'uppercase',letterSpacing:1,marginBottom:2}}>
            {isPreAddon?`Уровень ${lvl+1} / ${ADDON_AFTER}`:`Уровень ${lvl+1} (после аддона)`}
          </div>
          <div style={{fontFamily:'Cinzel',fontSize:16,color:'#ffa657',fontWeight:700,marginBottom:8}}>{blind.sb} / {blind.bb}</div>
          <div style={{fontFamily:'Cinzel',fontSize:48,fontWeight:700,color:timeColor,letterSpacing:2,lineHeight:1,animation:secs<=30?'urgentPulse 0.5s ease infinite':undefined}}>{mm}:{ss2}</div>
          <div style={{margin:'8px auto',width:'75%',height:3,background:'rgba(255,255,255,0.07)',borderRadius:2,overflow:'hidden'}}>
            <div style={{height:'100%',width:`${pct}%`,background:`linear-gradient(90deg,${C.green},#4dc46a)`,borderRadius:2,transition:'width 1s linear'}}/>
          </div>
          <div style={{color:C.dimmer,fontSize:12}}>
            {lvl===ADDON_AFTER-1&&!addonDone?'После этого уровня — АДДОН':`Следующий: ${nextBlind.sb} / ${nextBlind.bb}`}
          </div>
        </div>

        {/* Controls */}
        <div style={{display:'flex',gap:8,margin:'0 16px 10px'}}>
          <Btn label={running?'⏸ Пауза':'▶ Старт'} full onClick={toggleRun} style={{flex:2,borderRadius:11,padding:'11px'}}/>
          <Btn label="📋" ghost onClick={()=>setShowLevels(true)} style={{width:44,borderRadius:11,padding:'11px 0',fontSize:18}}/>
          <Btn label="⏮" ghost onClick={()=>jumpLevel(-1)} style={{width:44,borderRadius:11,padding:'11px 0',fontSize:18}}/>
          <Btn label="⏭" ghost onClick={()=>jumpLevel(1)} style={{width:44,borderRadius:11,padding:'11px 0',fontSize:18}}/>
        </div>

        <StatBar items={[{label:'Банк',value:`${bank}₽`,accent:true},{label:'Активных',value:active},{label:'Вылетело',value:players.length-active}]}/>
      </div>
      <div style={{height:2,background:`linear-gradient(90deg,transparent,${C.green},transparent)`,flexShrink:0}}/>

      <div className="scroll tourn-list" style={{flex:1,padding:'12px 16px'}}>
        {players.map(p=>(
          <PlayerRow key={p.name} name={p.name} dim={p.eliminated} onClick={()=>setSheet({type:'edit',name:p.name})}
            sub={`${tPaid(p)}₽${p.rebuys>0?` · ${p.rebuys}× рибай`:''}${p.addon>0?` · аддон ${p.addon}₽`:''}${p.paidNow?' · рассчитался ✓':''}`}
            badge={p.eliminated?{text:'ВЫЛЕТЕЛ',color:C.red,bg:'rgba(194,59,34,0.15)',border:'rgba(194,59,34,0.3)'}:null}
            actions={p.eliminated
              ?<Btn label="Рибай" ghost small onClick={()=>setSheet({type:'rebuy',player:p})}/>
              :<Btn label="Вылет" danger small onClick={()=>{setPayWith('');setSheet({type:'elim',player:p});}}/>
            }
          />
        ))}
      </div>
      </div>

      <div style={{padding:'10px 16px 14px',background:C.bg,borderTop:`1px solid ${C.border}`,flexShrink:0}}>
        {lastElim && players.some(p=>p.name===lastElim&&p.eliminated) && (
          <button onClick={undoElim} style={{width:'100%',marginBottom:8,background:'rgba(201,168,76,0.08)',border:`1px solid ${C.borderBright}`,borderRadius:10,color:C.gold,fontSize:13,fontWeight:600,padding:'8px',cursor:'pointer'}}>
            ↩ Отменить вылет {lastElim}
          </button>
        )}
        <div style={{display:'flex',gap:8}}>
          <Btn label="+ Игрок" ghost onClick={()=>setSheet({type:'addplayer'})} style={{borderRadius:11,padding:'11px 12px',flexShrink:0}}/>
          {!addonDone && <Btn label="🎰 Аддон" ghost full onClick={()=>onAddon(players)} style={{flex:1,borderRadius:11,padding:'11px'}}/>}
          {addonDone  && <Btn label="🏁 Призы →" full onClick={()=>onEnd(players,bank)} style={{flex:2,borderRadius:11,padding:'11px'}}/>}
          {!addonDone && <Btn label="🏁 Конец" danger onClick={()=>onEnd(players,bank)} small style={{borderRadius:11,padding:'11px 12px'}}/>}
        </div>
      </div>

      {/* Blind levels modal */}
      {showLevels && (
        <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.88)',display:'flex',alignItems:'flex-end',zIndex:100}} onClick={()=>setShowLevels(false)}>
          <div onClick={e=>e.stopPropagation()} style={{background:C.surface2,border:`1px solid ${C.borderBright}`,borderRadius:'18px 18px 0 0',padding:'20px 18px 36px',width:'100%',maxHeight:'65%',overflowY:'auto',WebkitOverflowScrolling:'touch',overscrollBehavior:'contain',animation:'slideUp 0.25s ease'}}>
            <div style={{fontFamily:'Cinzel',color:C.gold,fontSize:17,marginBottom:14}}>Структура блайндов</div>
            {BLINDS.map((b,i)=>(
              <div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'9px 0',borderBottom:`1px solid ${C.border}`,background:i===lvl?'rgba(201,168,76,0.05)':'transparent'}}>
                <span style={{color:i===lvl?C.gold:C.muted,fontSize:12}}>
                  {i===ADDON_AFTER?'🎰 ':''}{i<ADDON_AFTER?`Ур. ${i+1}`:`Ур. ${i+1} (пост-аддон)`}
                </span>
                <span style={{color:i===lvl?C.cream:C.muted,fontSize:14,fontWeight:600,fontFamily:'Cinzel'}}>{b.sb} / {b.bb}</span>
                {i===lvl&&<span style={{color:C.green,fontSize:10}}>← сейчас</span>}
              </div>
            ))}
          </div>
        </div>
      )}

      {sheet?.type==='elim' && (
        <BottomSheet title="Вылет" sub={`${sheet.player.name} · взносы ${tPaid(sheet.player)}₽`} onClose={()=>setSheet(null)}>
          {!sheet.player.paidNow && <PayNowPicker leaver={sheet.player.name} amount={-tPaid(sheet.player)} value={payWith} onChange={setPayWith}
            candidates={players.filter(q=>!q.eliminated&&q.name!==sheet.player.name).map(q=>q.name)}/>}
          <div style={{color:C.dimmer,fontSize:12,marginBottom:12}}>Если он займёт призовое место — приз досчитается в общем финале.</div>
          <div style={{display:'flex',gap:8}}>
            <Btn label="Отмена" ghost full onClick={()=>setSheet(null)}/>
            <Btn label="Подтвердить" full onClick={()=>eliminate(sheet.player.name)}/>
          </div>
        </BottomSheet>
      )}
      {sheet?.type==='rebuy' && (
        <BottomSheet title="Рибай" sub={`${sheet.player.name} · +300₽ = 3000 фишек`} onClose={()=>setSheet(null)}>
          <div style={{display:'flex',gap:8}}>
            <Btn label="Отмена" ghost full onClick={()=>setSheet(null)}/>
            <Btn label="Рибай +300₽" full onClick={()=>rebuy(sheet.player.name)}/>
          </div>
        </BottomSheet>
      )}
      {sheet?.type==='addplayer' && (
        <AddPlayerSheet players={players} defaultBuyin={300} onClose={()=>setSheet(null)}
          onAdd={p=>{setPlayers(ps=>[...ps,p]);setSheet(null);}}/>
      )}
      {editPlayer && (
        <TournEditSheet key={editPlayer.name} player={editPlayer} showAddon={addonDone||editPlayer.addon>0}
          onClose={()=>setSheet(null)} onSave={saveEdit} onRemove={removePlayer}/>
      )}
    </div>
  );
}

// ════════════════════════════════════════════════════════
// SCREEN: ADDON
// ════════════════════════════════════════════════════════
function AddonScreen({players,onDone,onBack}) {
  const active = players.filter(p=>!p.eliminated);
  const [sel,setSel] = usePersist('g_addonSel',()=>Object.fromEntries(active.map(p=>[p.name,0])));

  return (
    <div className="screen-anim" style={{flex:1,height:0,background:C.bg,display:'flex',flexDirection:'column',overflow:'hidden'}}>
      <Header title="Аддон" sub="Выберите аддон для каждого игрока" onBack={onBack}/>
      <div className="scroll" style={{flex:1,padding:'0 16px 12px'}}>
        {active.map(p=>(
          <div key={p.name} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:13,padding:'14px',marginBottom:10}}>
            <div style={{color:C.cream,fontSize:14,fontWeight:600,marginBottom:12}}>{p.name}</div>
            <div style={{display:'flex',gap:8}}>
              {[{val:600,label:'600₽'},{val:300,label:'300₽'},{val:0,label:'Без'}].map(({val,label})=>(
                <button key={val} onClick={()=>setSel(s=>({...s,[p.name]:val}))} style={{flex:1,padding:'10px 6px',borderRadius:9,fontSize:14,fontWeight:600,cursor:'pointer',border:`1.5px solid ${sel[p.name]===val?(val===0?'rgba(90,78,56,0.6)':C.green):'rgba(255,255,255,0.06)'}`,background:sel[p.name]===val?(val===0?'rgba(90,78,56,0.1)':'rgba(45,138,74,0.15)'):'rgba(255,255,255,0.02)',color:sel[p.name]===val?(val===0?C.muted:C.green):C.muted,transition:'all 0.15s'}}>{label}</button>
              ))}
            </div>
          </div>
        ))}
      </div>
      <div style={{padding:'10px 16px 14px',background:C.bg,borderTop:`1px solid ${C.border}`,flexShrink:0}}>
        <Btn label="Готово → Продолжить игру" full onClick={()=>onDone(sel)}/>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════
// SCREEN: PRIZES
// ════════════════════════════════════════════════════════
function PrizesScreen({players,bank,onSettle,onBack}) {
  const [prizes,setPrizes]   = usePersist('g_prizes',['','','']);
  const [winners,setWinners] = usePersist('g_winners',['','','']);
  const MEDALS=['🥇','🥈','🥉'];

  const pool  = bank;
  const total = prizes.reduce((s,v)=>s+(parseInt(v)||0),0);
  const diff  = pool-total;
  const canCalc = winners[0] && (parseInt(prizes[0])||0)>0;

  return (
    <div className="screen-anim" style={{flex:1,height:0,background:C.bg,display:'flex',flexDirection:'column',overflow:'hidden'}}>
      <Header title="Призы" sub="Распределение выплат" onBack={onBack}/>
      <div className="scroll" style={{flex:1,padding:'0 16px 12px'}}>
        <StatBar items={[{label:'Призовой фонд',value:`${bank}₽`,accent:true},{label:'Игроков',value:players.length}]}/>

        {/* Prize amounts */}
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:13,padding:'14px',marginBottom:12}}>
          <div style={{color:C.gold,fontSize:11,textTransform:'uppercase',letterSpacing:1,marginBottom:12,fontWeight:600}}>🏆 Суммы призов</div>
          {[0,1,2].map(i=>(
            <div key={i} style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
              <span style={{fontSize:18,width:26}}>{MEDALS[i]}</span>
              <Input type="number" value={prizes[i]} onChange={e=>setPrizes(p=>p.map((v,j)=>j===i?e.target.value:v))} placeholder="0" style={{flex:1}}/>
              <span style={{color:C.muted,fontSize:14,flexShrink:0}}>₽</span>
            </div>
          ))}
          {total>0 && (
            <div style={{fontSize:13,marginTop:4,color:Math.abs(diff)<2?C.green:diff>0?'#ffa657':C.red}}>
              {Math.abs(diff)<2?'✅ Сумма сходится':diff>0?`⚠️ Нераспределено: ${diff}₽`:`❌ Перебор: ${-diff}₽`}
            </div>
          )}
        </div>

        {/* Winners */}
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:13,padding:'14px',marginBottom:12}}>
          <div style={{color:C.gold,fontSize:11,textTransform:'uppercase',letterSpacing:1,marginBottom:12,fontWeight:600}}>🎖 Победители</div>
          {[0,1,2].map(i=>(
            <div key={i} style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
              <span style={{fontSize:18,width:26}}>{MEDALS[i]}</span>
              <select value={winners[i]} onChange={e=>setWinners(w=>w.map((v,j)=>j===i?e.target.value:v))} style={{flex:1,background:C.surface2,border:`1px solid ${C.border}`,borderRadius:9,color:winners[i]?C.cream:C.muted,padding:'11px 12px',fontSize:14,fontFamily:'Plus Jakarta Sans'}}>
                <option value="">— выбери —</option>
                {players.map(p=><option key={p.name} value={p.name}>{p.name}</option>)}
              </select>
            </div>
          ))}
        </div>
      </div>

      <div style={{padding:'10px 16px 14px',background:C.bg,borderTop:`1px solid ${C.border}`,flexShrink:0}}>
        <Btn label="Рассчитать →" full onClick={()=>onSettle({winners,prizes:prizes.map(v=>parseInt(v)||0),players})} disabled={!canCalc}/>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════
// SCREEN: CASH FINAL (enter chips for remaining players)
// ════════════════════════════════════════════════════════
function CashFinalScreen({players,ratio,onDone,onBack}) {
  const remaining = players.filter(p=>!p.cashedOut);
  const [chips,setChips] = usePersist('g_finalChips',()=>Object.fromEntries(remaining.map(p=>[p.name,''])));

  const paid = p => p.buyins.reduce((s,b)=>s+b,0);
  const rub  = v => Math.round((parseInt(v)||0)/ratio);
  const canDone = remaining.every(p=>(chips[p.name]??'')!=='');

  const handleDone = () => {
    const updated = players.map(p=>{
      if(p.cashedOut) return p;
      return {...p,chips:parseInt(chips[p.name])||0,cashedOut:true};
    });
    const bank   = updated.reduce((s,p)=>s+paid(p),0);
    const chipsIn  = updated.reduce((s,p)=>s+paid(p)*ratio,0);
    const chipsOut = updated.reduce((s,p)=>s+(p.chips||0),0);
    const bal={};
    updated.forEach(p=>{ bal[p.name]=rub(p.chips||0)-paid(p); });
    const paidNow = applyPaidNow(bal, updated);
    onDone({players:updated,bank,bal,chipDiff:chipsIn-chipsOut,ratio,paidNow});
  };

  return (
    <div className="screen-anim" style={{flex:1,height:0,background:C.bg,display:'flex',flexDirection:'column',overflow:'hidden'}}>
      <Header title="Финал" sub="Введите фишки оставшихся игроков" onBack={onBack}/>
      <div className="scroll" style={{flex:1,padding:'0 16px 12px'}}>
        {remaining.map(p=>{
          const v=chips[p.name]??'';
          const net=v!==''?rub(v)-paid(p):null;
          return (
            <div key={p.name} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:13,padding:'14px',marginBottom:10}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
                <div style={{color:C.cream,fontSize:14,fontWeight:600}}>{p.name}</div>
                <div style={{color:C.muted,fontSize:12}}>Закупы: {paid(p)}₽</div>
              </div>
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <Input type="number" value={v} onChange={e=>setChips(c=>({...c,[p.name]:e.target.value}))} placeholder="Фишки на руках" style={{flex:1}}/>
              </div>
              {net!==null && (
                <div style={{color:net>=0?C.green:C.red,fontSize:13,marginTop:6}}>
                  {parseInt(v)||0} фишек = {rub(v)}₽ → {net>=0?'+':''}{net}₽
                </div>
              )}
            </div>
          );
        })}
        {/* Already cashed out */}
        {players.filter(p=>p.cashedOut).map(p=>{
          const net=Math.round((p.chips||0)/ratio)-paid(p);
          return (
            <div key={p.name} style={{background:'rgba(0,0,0,0.2)',border:`1px solid rgba(90,78,56,0.2)`,borderRadius:13,padding:'12px 14px',marginBottom:10,opacity:0.5,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div style={{color:C.cream,fontSize:14}}>✓ {p.name}{p.paidNow && <span style={{color:C.green,fontSize:11}}> · рассчитался</span>}</div>
              <div style={{color:net>=0?C.green:C.red,fontSize:13,fontWeight:600}}>{net>=0?'+':''}{net}₽</div>
            </div>
          );
        })}
      </div>
      <div style={{padding:'10px 16px 14px',background:C.bg,borderTop:`1px solid ${C.border}`,flexShrink:0}}>
        <Btn label="Рассчитать →" full onClick={handleDone} disabled={!canDone}/>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════
// SCREEN: SETTLEMENT
// ════════════════════════════════════════════════════════
function SettleScreen({title,summaries,transfers,paidTransfers,note,onNewGame,onBack,onEdit,backLabel}) {
  const renderTransfer = (t,i,arr,isLast) => (
    <div key={i} style={{display:'flex',alignItems:'center',padding:'12px 14px',borderBottom:i<arr.length-1?`1px solid ${C.border}`:'none',gap:8}}>
      <span style={{color:C.red,fontWeight:600,fontSize:14}}>{t.from}</span>
      <span style={{color:C.dimmer,fontSize:12}}>→</span>
      <span style={{color:C.green,fontWeight:600,fontSize:14,flex:1}}>{t.to}</span>
      {t.label && <span style={{color:C.muted,fontSize:11,background:'rgba(90,78,56,0.2)',padding:'2px 7px',borderRadius:5}}>{t.label}</span>}
      <span style={{fontFamily:'Cinzel',color:C.gold,fontWeight:700,fontSize:16}}>{t.amount}₽</span>
    </div>
  );
  return (
    <div className="screen-anim" style={{flex:1,height:0,background:C.bg,display:'flex',flexDirection:'column',overflow:'hidden'}}>
      <Header title={title} onBack={onBack}/>
      <div className="scroll" style={{flex:1,padding:'0 16px 12px'}}>
        {note && <div style={{background:'rgba(42,21,0,0.8)',border:'1px solid #9e5a00',borderRadius:10,padding:'12px',marginBottom:12,fontSize:13,color:'#ffa657'}}>{note}</div>}

        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:13,overflow:'hidden',marginBottom:12}}>
          {summaries.map((s,i)=>(
            <div key={s.name} style={{display:'flex',alignItems:'center',padding:'12px 14px',borderBottom:i<summaries.length-1?`1px solid ${C.border}`:'none'}}>
              <div style={{width:34,height:34,borderRadius:8,background:C.surface2,border:`1px solid ${C.border}`,display:'flex',alignItems:'center',justifyContent:'center',color:C.gold,fontSize:12,fontWeight:700,marginRight:10,flexShrink:0}}>{s.name[0]}</div>
              <div style={{flex:1}}>
                <div style={{color:C.cream,fontSize:14,fontWeight:600}}>{s.name}</div>
                <div style={{color:C.muted,fontSize:12,marginTop:1}}>{s.sub}</div>
              </div>
              <div style={{fontFamily:'Cinzel',fontSize:16,fontWeight:700,color:s.net>0?C.green:s.net<0?C.red:C.muted}}>
                {s.net>0?'+':''}{s.net}₽
              </div>
            </div>
          ))}
        </div>

        <div style={{color:C.gold,fontSize:11,textTransform:'uppercase',letterSpacing:1,marginBottom:8,fontWeight:600,marginTop:4}}>💸 Кто кому переводит</div>
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:13,overflow:'hidden',marginBottom:12}}>
          {transfers.length===0
            ?<div style={{textAlign:'center',color:C.muted,padding:'16px',fontSize:13}}>Все в расчёте 🎉</div>
            :transfers.map((t,i)=>renderTransfer(t,i,transfers))
          }
        </div>
        {paidTransfers?.length>0 && <>
          <div style={{color:C.green,fontSize:11,textTransform:'uppercase',letterSpacing:1,marginBottom:4,fontWeight:600}}>✅ Уже рассчитались во время игры</div>
          <div style={{color:C.dimmer,fontSize:12,marginBottom:8}}>Эти переводы уже сделаны и учтены выше</div>
          <div style={{background:C.surface,border:'1px solid rgba(45,138,74,0.3)',borderRadius:13,overflow:'hidden',marginBottom:12,opacity:0.75}}>
            {paidTransfers.map((t,i)=>renderTransfer({...t,label:'уже'},i,paidTransfers))}
          </div>
        </>}
      </div>
      <div style={{padding:'10px 16px 14px',background:C.bg,borderTop:`1px solid ${C.border}`,flexShrink:0}}>
        {onEdit && <div style={{display:'flex',gap:8,marginBottom:8}}>
          <Btn label={backLabel} ghost onClick={onBack} style={{flex:1,borderRadius:11,padding:'12px 8px',fontSize:14}}/>
          <Btn label="✎ Закупы" ghost onClick={onEdit} style={{flex:1,borderRadius:11,padding:'12px 8px',fontSize:14}}/>
        </div>}
        <Btn label="Новая игра" full onClick={()=>{ if(!onEdit||confirm('Начать новую игру? Эту игру уже нельзя будет исправить.')) onNewGame(); }}/>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════
// ROOT APP
// ════════════════════════════════════════════════════════
function App() {
  const [screen,setScreen] = usePersist('a_screen','home');
  const [mode,setMode]     = usePersist('a_mode',null);
  const [setup,setSetup]   = usePersist('a_setup',null);
  const [game,setGame]     = usePersist('a_game',null);
  const [settle,setSettle] = usePersist('a_settle',null);
  const [tweaksVisible,setTweaksVisible] = React.useState(false);

  // Игроки живут в game.players (а не внутри экранов), поэтому переходы
  // кэш ↔ финал и турнир ↔ аддон/призы ничего не сбрасывают.
  const setPlayers = fn => setGame(g=>({...g,players:typeof fn==='function'?fn(g.players):fn}));
  const exitGame = () => {
    if(!confirm('Выйти из игры? Закупы и результаты этой игры будут удалены.')) return;
    lsClearGame(); setGame(null); setSetup(null); go('setup');
  };

  React.useEffect(()=>{
    window.addEventListener('message',e=>{
      if(e.data?.type==='__activate_edit_mode')   setTweaksVisible(true);
      if(e.data?.type==='__deactivate_edit_mode') setTweaksVisible(false);
    });
    window.parent.postMessage({type:'__edit_mode_available'},'*');
  },[]);

  const go = s => setScreen(s);

  const handleSetup = (s,m) => {
    lsClearGame(); // сбрасываем состояние предыдущей игры
    setGame({players:s.players});
    setSettle(null);
    setSetup({...s,addonDone:false});
    setMode(m);
    go(m==='cash'?'cash':'tourn');
  };

  const handleAddon = (players) => {
    setGame(g=>({...g,players}));
    go('addon');
  };

  const handleAddonDone = (sel) => {
    setSetup(s=>({...s,addonDone:true}));
    setGame(g=>({...g,players:g.players.map(p=>({...p,addon:sel[p.name]??0}))}));
    go('tourn');
  };

  const handleCashFinal = (players) => {
    setGame(g=>({...(g||{}),players}));
    go('cashFinal');
  };

  const handleCashEnd = ({players,bank,bal,chipDiff,ratio,paidNow}) => {
    const summaries = [...players].sort((a,b)=>{
      const an=Math.round((a.chips||0)/ratio)-a.buyins.reduce((s,b)=>s+b,0);
      const bn=Math.round((b.chips||0)/ratio)-b.buyins.reduce((s,b)=>s+b,0);
      return bn-an;
    }).map(p=>{
      const p2=p.buyins.reduce((s,b)=>s+b,0);
      const rub=Math.round((p.chips||0)/ratio);
      return {name:p.name,sub:`Закупы ${p2}₽  •  Кэш-аут ${rub}₽${p.paidNow?'  •  ушёл раньше':''}`,net:rub-p2};
    });
    const transfers = simplifyDebts(bal);
    const note = chipDiff!==0?`⚠️ Расхождение ${Math.abs(chipDiff)} фишек — возможно кто-то пересчитал неверно`:null;
    setSettle({title:'Кэш — Расчёт',summaries,transfers,paidTransfers:paidNow||[],note});
    go('settle');
  };

  const handleTournEnd = (players,bank) => {
    setGame(g=>({...g,bank}));
    go('prizes');
  };

  const handlePrizeSettle = ({winners,prizes,players}) => {
    const bal={};
    players.forEach(p=>{ bal[p.name]=-(p.buyins[0]+p.rebuys*300+p.addon); });
    [0,1,2].forEach(i=>{ if(winners[i]&&prizes[i]) bal[winners[i]]=(bal[winners[i]]||0)+prizes[i]; });
    // Итог игрока (до учёта расчётов «сразу») — для списка результатов
    const result={...bal};
    const paidNow=applyPaidNow(bal, players);
    const summaries=[...players].map(p=>{
      const paid=p.buyins[0]+p.rebuys*300+p.addon;
      const w=[0,1,2].reduce((s,i)=>s+(winners[i]===p.name?prizes[i]:0),0);
      return {name:p.name,sub:`Заплатил ${paid}₽${w?`  •  Приз ${w}₽`:''}${p.paidNow?'  •  ушёл раньше':''}`,net:result[p.name]};
    }).sort((a,b)=>b.net-a.net);
    const transfers=simplifyDebts(bal);
    setSettle({title:'Турнир — Расчёт',summaries,transfers,paidTransfers:paidNow,note:null});
    go('settle');
  };

  const renderScreen = () => {
    const home = <HomeScreen onMode={m=>{setMode(m);go('setup');}}/>;
    const inGame = ['cash','cashFinal','tourn','addon','prizes'].includes(screen);
    if(inGame && !(setup && game?.players)) return home; // повреждённое сохранение
    switch(screen) {
      case 'home':   return home;
      case 'setup':  return <SetupScreen mode={mode} onBack={()=>go('home')} onStart={s=>handleSetup(s,mode)}/>;
      case 'cash':     return <CashScreen setup={setup} players={game.players} setPlayers={setPlayers} onBack={exitGame} onEnd={()=>go('cashFinal')}/>;
      case 'cashFinal': return <CashFinalScreen players={game.players} ratio={setup.ratio||2} onBack={()=>go('cash')} onDone={handleCashEnd}/>;
      case 'tourn':  return <TournamentScreen setup={setup} players={game.players} setPlayers={setPlayers} onBack={exitGame}
                       onAddon={()=>go('addon')}
                       onEnd={handleTournEnd}/>;
      case 'addon':  return <AddonScreen players={game.players} onBack={()=>go('tourn')} onDone={handleAddonDone}/>;
      case 'prizes': return <PrizesScreen players={game.players} bank={game.bank||0} onBack={()=>go('tourn')} onSettle={handlePrizeSettle}/>;
      case 'settle': {
        // С экрана расчёта можно вернуться назад, поправить закупы/фишки/призы и пересчитать.
        const canBack = !!(setup && game?.players);
        const isCash = mode==='cash';
        return settle?<SettleScreen {...settle}
                       onBack={canBack?()=>go(isCash?'cashFinal':'prizes'):undefined}
                       onEdit={canBack?()=>go(isCash?'cash':'tourn'):undefined}
                       backLabel={isCash?'← Фишки':'← Призы'}
                       onNewGame={()=>{lsClearGame();setSettle(null);setGame(null);setSetup(null);go('home');}}/>:home;
      }
      default:       return <HomeScreen onMode={m=>{setMode(m);go('setup');}}/>;
    }
  };

  return (
    <div>
      <div id="phone-wrap">
        <IOSDevice width={390} height={844} dark>
          <div style={{flex:1,height:0,display:'flex',flexDirection:'column',background:C.bg}}>
            {renderScreen()}
          </div>
        </IOSDevice>
      </div>
      <div id="tweaks-panel" className={tweaksVisible?'visible':''}>
        <h4>Tweaks</h4>
        <label>Тема</label>
        <select><option>Золото (казино)</option><option>Серебро</option></select>
      </div>
    </div>
  );
}

// ── VIEWPORT / KEYBOARD ─────────────────────────────────
// На iPhone клавиатура не уменьшает 100dvh, а сдвигает видимую область.
// Подгоняем приложение под реально видимую часть экрана, чтобы список
// можно было докрутить до любого поля, а кнопки внизу оставались над клавиатурой.
(function fitViewport(){
  const vv = window.visualViewport;
  const root = document.documentElement;
  const apply = () => {
    const h = vv ? vv.height : window.innerHeight;
    root.style.setProperty('--app-h', Math.round(h)+'px');
    root.style.setProperty('--app-top', Math.round(vv ? vv.offsetTop : 0)+'px');
    if (window.scrollY) window.scrollTo(0,0);
  };
  apply();
  if (vv) { vv.addEventListener('resize', apply); vv.addEventListener('scroll', apply); }
  window.addEventListener('resize', apply);
  window.addEventListener('orientationchange', () => setTimeout(apply, 300));
  // Поле ввода, на которое нажали, прокручиваем в середину видимой области
  document.addEventListener('focusin', e => {
    const el = e.target;
    if (!el || !/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName)) return;
    setTimeout(() => { apply(); el.scrollIntoView({block:'center', behavior:'smooth'}); }, 350);
  });
})();

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);

function scalePhone() { /* disabled: renders fullscreen on real device */ }
